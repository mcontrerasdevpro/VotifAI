services:
  - type: web
    name: votifai
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm install --dir server --frozen-lockfile && pnpm build
    startCommand: node server/index.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # Sin esta clave, la transcripción de voz en Junta en Vivo devuelve
      # un error controlado; el resto de la app funciona igual.
      - key: OPENAI_API_KEY
        sync: false
      # Sin esta URL, las convocatorias y actas solo se registran en el
      # log del servidor y NUNCA llegan a los propietarios.
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: DEMO_NOTIFICATION_EMAIL
        sync: false
      # Sin STRIPE_SECRET_KEY, el checkout de pago queda deshabilitado
      # para todos los planes.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_PROFESIONAL
        sync: false
      - key: STRIPE_PRICE_PREMIUM
        sync: false