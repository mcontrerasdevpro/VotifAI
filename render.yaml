services:
  - type: web
    name: votifai
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm install --dir server --frozen-lockfile && pnpm build
    startCommand: node server/index.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false